{% extends "base.html" %}
{% block title %}New Product{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('products.list_products') }}">Products</a> / New{% endblock %}

{% block content %}
<section class="page-header">
  <h1 class="page-title">Add New Product</h1>
</section>

<div class="form-card">
  <form method="POST" action="{{ url_for('products.new_product') }}" id="new-product-form">
    <div class="form-row">
      <div class="form-group">
        <label for="name" class="form-label">Product Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Wireless Headphones" required />
      </div>
      <div class="form-group">
        <label for="category" class="form-label">Category</label>
        <input type="text" id="category" name="category" class="form-input" placeholder="e.g. Electronics" value="General" />
      </div>
    </div>
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" class="form-input form-textarea" rows="3" placeholder="Brief product description…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="price" class="form-label">Price ($) <span class="required">*</span></label>
        <input type="number" id="price" name="price" class="form-input" min="0" step="0.01" placeholder="0.00" required />
      </div>
      <div class="form-group">
        <label for="stock" class="form-label">Stock</label>
        <input type="number" id="stock" name="stock" class="form-input" min="0" placeholder="0" value="0" />
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('products.list_products') }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary" id="btn-submit-product">Add Product</button>
    </div>
  </form>
</div>
{% endblock %}
