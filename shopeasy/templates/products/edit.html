{% extends "base.html" %}
{% block title %}Edit {{ product.name }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('products.list_products') }}">Products</a> / <a href="{{ url_for('products.product_detail', product_id=product.id) }}">{{ product.name }}</a> / Edit{% endblock %}

{% block content %}
<section class="page-header">
  <h1 class="page-title">Edit Product</h1>
</section>

<div class="form-card">
  <form method="POST" action="{{ url_for('products.edit_product', product_id=product.id) }}" id="edit-product-form">
    <div class="form-row">
      <div class="form-group">
        <label for="name" class="form-label">Product Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" class="form-input" value="{{ product.name }}" required />
      </div>
      <div class="form-group">
        <label for="category" class="form-label">Category</label>
        <input type="text" id="category" name="category" class="form-input" value="{{ product.category }}" />
      </div>
    </div>
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" class="form-input form-textarea" rows="3">{{ product.description }}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="price" class="form-label">Price ($)</label>
        <input type="number" id="price" name="price" class="form-input" min="0" step="0.01" value="{{ product.price }}" />
      </div>
      <div class="form-group">
        <label for="stock" class="form-label">Stock</label>
        <input type="number" id="stock" name="stock" class="form-input" min="0" value="{{ product.stock }}" />
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary" id="btn-update-product">Update Product</button>
    </div>
  </form>
</div>
{% endblock %}
